codecov:
  require_ci_to_pass: true
  notify:
    after_n_builds: 1
    wait_for_ci: true

coverage:
  precision: 2
  round: down
  range: 70..100
  status:
    project:
      default:
        target: 99%
        threshold: 0%
        if_ci_failed: error
    patch:
      default:
        target: 99%
        threshold: 0%
        if_ci_failed: error

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: false
